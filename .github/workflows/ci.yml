name: CI/CD Pipeline

# Trigger the workflow on push to main/master and on pull requests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test: # job 1 - Runs tests
    # type of machine to run the job on, GitHub will create a
    # temporary Ubunty Linux virtual machine (runner) for your
    # workflow. After the job finishes, GitHub destroys the VM
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-not-for-production

    # sequence of job tasks
    steps:
      - name: Checkout code
        # checks out your code from GitHub repo to runner machine (specified above - ubuntu VM)
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project dependencies
        run: uv sync --frozen --no-dev

      - name: Run tests
        run: uv run python -m pytest todo/tests -v --tb=short

      - name: Run coverage report
        run: uv run python -m pytest todo/tests --cov=todo --cov-report=xml

  docker-build: # job 2 - Builds Docker image (but doesn't push)
    # Only run if tests above pass
    needs: test
    runs-on: ubuntu-latest  # runs on new Ubuntu VM

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # installs and configure docker in ubuntu VM

      - name: Build Docker image
        uses: docker/build-push-action@v5   # builds docker image
        with:
          context: .      # looks for Dockerfile in current directory (root)
          push: false     # build image but do not push to Docker hub or registry
          tags: todo-api:latest
          # uses caching for faster builds
          cache-from: type=gha    # docker layer caching, load from previous builds
          cache-to: type=gha, mode=max  # save cache for future builds (max caching)

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'todo-api:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true

